function validatePlayerName(){
  const raw=nameInput.value.trim(),suggested=suggestedHangulName(raw);
  const ready = raw.length > 0;
  nameSubmit.disabled = !ready;
  nameSubmit.textContent = ready ? `${raw.slice(0,12)} · 타자 전신 송신` : '이름을 타자기로 입력하세요';
  nameLayoutFix.classList.toggle('on',!!suggested);
  nameLayoutFix.textContent=suggested?`한글 자판 입력으로 보입니다 · “${suggested}”로 고치기`:'';
  $('#name-hint').textContent = ready
    ? `${raw}, 이 이름을 활자로 찍어 1920년의 윤식에게 보냅니다.`
    : '키를 누르면 종이 위에 이름이 한 글자씩 찍힙니다.';
}
let lastNameLength=0;
let virtualKeyBuffer='',virtualBase='',virtualUpdating=false,virtualSession=false;
nameInput.addEventListener('input', ()=>{
  if(!virtualUpdating){virtualSession=false;virtualKeyBuffer='';}
  const machine=$('#name-typewriter');
  machine.classList.remove('strike');void machine.offsetWidth;machine.classList.add('strike');
  machine.style.setProperty('--paper-shift',`${Math.min(3,nameInput.value.length*.22)}px`);
  tone(nameInput.value.length<lastNameLength?155:135+Math.random()*28,.035,'square',.035);
  lastNameLength=nameInput.value.length;validatePlayerName();
});
nameLayoutFix.addEventListener('click',()=>{const fixed=suggestedHangulName(nameInput.value);if(fixed){nameInput.value=fixed;lastNameLength=fixed.length;tone(520,.06,'square',.05);validatePlayerName();nameInput.focus()}});
nameInput.addEventListener('keydown', e=>{ if(e.key === 'Enter' && !nameSubmit.disabled) nameSubmit.click(); });
function updateNameFromVirtualKeys(){
  virtualUpdating=true;
  nameInput.value=(virtualBase+engKeysToHangul(virtualKeyBuffer)).slice(0,12);
  nameInput.dispatchEvent(new Event('input',{bubbles:true}));
  virtualUpdating=false;
  nameInput.focus();
}
$('#name-virtual-keys').querySelectorAll('button').forEach(key=>key.addEventListener('click',()=>{
  if(nameInput.disabled)return;
  key.classList.add('pressed');setTimeout(()=>key.classList.remove('pressed'),90);
  if(!virtualSession){virtualBase=nameInput.value;virtualKeyBuffer='';virtualSession=true;}
  const action=key.dataset.action;
  if(action==='backspace'){
    if(virtualKeyBuffer)virtualKeyBuffer=virtualKeyBuffer.slice(0,-1);
    else virtualBase=Array.from(virtualBase).slice(0,-1).join('');
  }else if(action==='space'){
    virtualBase=(virtualBase+engKeysToHangul(virtualKeyBuffer)+' ').slice(0,12);virtualKeyBuffer='';
  }else if(action==='enter'){
    if(!nameSubmit.disabled)nameSubmit.click();
    return;
  }else if(key.dataset.key){
    virtualKeyBuffer+=key.dataset.key;
  }
  updateNameFromVirtualKeys();
}));
validatePlayerName();
startBtn.addEventListener('click', startGame);
$('#btn-howto').addEventListener('click', ()=>{
  const h = $('#howto');
  h.style.display = h.style.display==='none' ? 'block' : 'none';
});
$('#btn-retry').addEventListener('click', ()=>location.reload());
$('#btn-mute').addEventListener('click', ()=>{
  state.muted = !state.muted;
  $('#btn-mute').textContent = state.muted ? '🔇' : '🔊';
  syncBgmMute();
});
$('#btn-back').addEventListener('click', ()=>{
  if(state.stage >= 0) reviewBriefing(state.stage);
});
</script>

<script>
/* ================================================================
   조작 연출 — 정답 입력 직후, 손으로 완성하는 성공의 순간
   1막 열쇠 돌리기 · 2막 벽돌 밀기 · 3막 금고 다이얼
   (3막 클리어 후 인력거 인계 직후엔 별도로 지시서 소각 연출이,
    4막 클리어 후엔 기억의 기록장에 이름을 남기는 연출이 이어진다.)
   ================================================================ */
const actLayer = document.createElement('div');
actLayer.id = 'act-layer';
document.body.appendChild(actLayer);

async function runStageAction(i){
  /* 4막(방공호)의 마무리 동작은 기억의 기록장 연출로 대체되어, 여기서는 별도 동작이 없다. */
  if(i===3) return;
  actLayer.classList.add('on');
  const acts = [actKey, actBrick, actDial];
  await acts[i]();
  await new Promise(r=>setTimeout(r, 350));
  actLayer.classList.remove('on');
}

/* 연락책이 명부를 안전히 넘겨받은 직후, 사무실에 남은 지시서의 흔적을 태워 없앤다. (1920년 시점 — 1940년대로 넘어가기 전에 마무리) */
async function playArrestOrderBurnScene(){
  actLayer.classList.add('on');
  await actBurn();
  await new Promise(r=>setTimeout(r, 350));
  actLayer.classList.remove('on');
}

/* 공통: 요소 중심 기준 포인터 각도(도) */
function angleOf(el, e){
  const r = el.getBoundingClientRect();
  return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2)) * 180 / Math.PI;
}
function normDeg(d){ while(d > 180) d -= 360; while(d < -180) d += 360; return d; }

/* ---------- 1막 : 놋쇠 열쇠 돌리기 ---------- */
function actKey(){
  return new Promise(res=>{
    actLayer.innerHTML = `
      <div class="act-box key-act">
        <div class="act-title">암호가 맞았다! 현관문에 놋쇠 열쇠가 꽂혀 있다.<br>열쇠를 잡고 시계 방향으로 한 바퀴 돌려라.</div>
        <div class="key-pad" id="key-pad">
          <svg class="key-ring" viewBox="0 0 240 240">
            <circle cx="120" cy="120" r="112" fill="none" stroke="rgba(233,217,174,.15)" stroke-width="5"/>
            <circle id="key-prog" cx="120" cy="120" r="112" fill="none" stroke="#c9a24b" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="703.7" stroke-dashoffset="703.7"
              transform="rotate(-90 120 120)"/>
          </svg>
          <div class="keyhole"></div>
          <svg class="key" id="key-rot" viewBox="-60 -60 120 120">
            <g stroke="#c9a24b" stroke-width="7" fill="none" stroke-linecap="round">
              <circle cx="0" cy="-30" r="15"/>
              <line x1="0" y1="-15" x2="0" y2="40"/>
              <line x1="0" y1="40" x2="15" y2="40"/>
              <line x1="0" y1="27" x2="10" y2="27"/>
            </g>
          </svg>
        </div>
      </div>`;
    const pad = document.getElementById('key-pad');
    const rot = document.getElementById('key-rot');
    const prog = document.getElementById('key-prog');
    const title = actLayer.querySelector('.act-title');
    let last = null, acc = 0, done = false, lastClick = 0;
    function move(e){
      if(done || last === null) return;
      const a = angleOf(pad, e);
      const d = normDeg(a - last); last = a;
      acc = Math.max(0, acc + (d > 0 ? d : d * 0.5));   /* 역방향은 절반만 풀린다 */
      rot.style.transform = `rotate(${acc}deg)`;
      prog.setAttribute('stroke-dashoffset', 703.7 * Math.max(0, 1 - acc/340));
      if(acc - lastClick > 30){ lastClick = acc; tone(500 + acc, .03, 'square', .05); buzz(12); }
      if(acc >= 340){
        done = true;
        pad.classList.add('unlocked');
        playDoorOpenSfx(); buzz([90,60,160,90,260]);
        title.textContent = '철컥――― 돌쩌귀가 무겁게 돌아가며, 문이 열렸다.';
        title.classList.add('done');
        setTimeout(res, 2300);
      }
    }
    pad.addEventListener('pointerdown', e=>{ last = angleOf(pad, e); pad.setPointerCapture(e.pointerId); });
    pad.addEventListener('pointermove', move);
    pad.addEventListener('pointerup', ()=>{ last = null; });
  });
}

/* ---------- 2막 : 헐거운 벽돌 밀기 ---------- */
function actBrick(){
  return new Promise(res=>{
    actLayer.innerHTML = `
      <div class="act-box brick-act">
        <div class="act-title">벽난로 오른편 적벽돌 벽.<br>줄눈이 벌어진 벽돌을 찾아 꾹 누른 채 버텨라!</div>
        <div class="fireplace-push-scene">
          <div class="fireplace-visual" aria-hidden="true">
            <img src="images/2-brief-1920-mirror-recreation.png" alt="">
            <span class="fireplace-caption">1920년 목포부청 서기실</span>
          </div>
          <div class="push-wall" id="push-wall">
            <div class="brick-cavity"></div>
            <div class="wall-map" id="wall-map">
              <svg viewBox="0 0 104 70" width="104" height="70">
                <path d="M12 56 L34 40 L30 22 L56 26 L74 14 L88 20" fill="none" stroke="#8a3524" stroke-width="2.5" stroke-dasharray="5 4"/>
                <text x="88" y="16" font-size="12" fill="#8a3524" font-weight="bold">✕</text>
                <text x="52" y="64" font-size="9" fill="#6b4f2a" text-anchor="middle" letter-spacing="2">밀실의 지도</text>
              </svg>
            </div>
            <i class="brick-dust d1"></i><i class="brick-dust d2"></i><i class="brick-dust d3"></i><i class="brick-dust d4"></i>
            <div class="brick-course course-a"><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span></div>
            <div class="brick-course course-b"><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span></div>
            <div class="brick-course course-a"><span class="wall-brick"></span><button class="wall-brick loose-brick" id="loose-brick" type="button" aria-label="줄눈이 벌어진 헐거운 벽돌"></button><span class="wall-brick"></span><span class="wall-brick"></span></div>
            <div class="brick-course course-b"><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span></div>
            <div class="brick-course course-a"><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span><span class="wall-brick"></span></div>
          </div>
        </div>
        <div class="push-gauge"><i id="push-fill"></i></div>
        <div class="push-label">압력을 유지하십시오</div>
      </div>`;
    const brick = document.getElementById('loose-brick');
    const fill = document.getElementById('push-fill');
    const wall = document.getElementById('push-wall');
    const dusts = [...wall.querySelectorAll('.brick-dust')];
    const title = actLayer.querySelector('.act-title');
    let p = 0, hold = null, decay = null, done = false;
    function render(){
      fill.style.width = p + '%';
      brick.style.transform = `scale(${1 - p*0.0022}) translateY(${p*0.03}px)`;
      brick.style.filter = `brightness(${1 - p*0.004})`;
      wall.style.setProperty('--pressure', p);
    }
    function start(e){
      if(done) return;
      brick.classList.add('pushing');
      wall.classList.add('pressing');
      brick.setPointerCapture(e.pointerId);
      clearInterval(decay);
      hold = setInterval(()=>{
        p = Math.min(100, p + 2.4); render();
        if(p % 12 < 2.4) {
          tone(64 + p*.38, .08, 'sawtooth', .04 + p*.00025);
          noiseBurst(.13,.03 + p*.00025,950 + p*4);
          buzz(p>70?22:12);
          dusts.forEach((dust,idx)=>{dust.classList.remove('fall');void dust.offsetWidth;setTimeout(()=>dust.classList.add('fall'),idx*28);});
        }
        if(p >= 100){ finish(); }
      }, 40);
    }
    function stop(){
      clearInterval(hold);
      wall.classList.remove('pressing');
      if(done) return;
      decay = setInterval(()=>{ p = Math.max(0, p - 1.6); render(); if(p<=0) clearInterval(decay); }, 40);
    }
    function finish(){
      done = true; clearInterval(hold);
      wall.classList.remove('pressing');
      wall.classList.add('opened');
      sweepTone(150,42,.75,'sawtooth',.065);
      noiseBurst(.85,.13,780);
      tone(48,.65,'sine',.13,.28); buzz([60,35,90,45,180]);
      brick.style.transition = 'transform .8s cubic-bezier(.2,.7,.2,1),filter .8s,opacity .65s .25s';
      brick.style.transform = 'translateY(18px) scale(.58) rotate(3deg)'; brick.style.filter='brightness(.28)';brick.style.opacity = '0';
      document.getElementById('wall-map').classList.add('reveal');
      sfx.found();
      title.textContent = '드르륵― 벽돌이 안으로 밀려 들어가며, 숨겨진 지도가 모습을 드러냈다!';
      title.classList.add('done');
      setTimeout(res, 2300);
    }
    brick.addEventListener('pointerdown', start);
    brick.addEventListener('pointerup', stop);
    brick.addEventListener('pointercancel', stop);
  });
}

/* ---------- 3막 : 금고 다이얼 (좌로 4, 우로 8) ---------- */
function actDial(){
  return new Promise(res=>{
    let nums = '';
    for(let n=0; n<10; n++){
      nums += `<i class="spoke" style="transform:rotate(${n*36}deg)"><b>${n}</b></i>`;
    }
    actLayer.innerHTML = `
      <div class="act-box dial-act">
        <div class="act-title">마루 밑, 육중한 철제 금고. 다이얼 자물쇠다.<br>윤식의 전보 ― 「함성의 날짜가 열쇠요!」</div>
        <div class="vault-console">
          <i class="vault-bolt tl"></i><i class="vault-bolt tr"></i><i class="vault-bolt bl"></i><i class="vault-bolt br"></i>
          <div class="dial-pad" id="dial-pad" aria-label="금고 조합 다이얼">
            <div class="dial-pointer"></div>
            <div class="dial-disc" id="dial-rot">${nums}</div>
            <div class="dial-face" id="dial-face">0</div>
          </div>
          <div class="dial-step" id="dial-step"><span class="dial-step-line">① 다이얼을 <b>왼쪽</b>으로 돌리세요.</span><span class="dial-step-line"><b>4</b>에 맞추면 첫 번째 잠금이 풀립니다.</span></div>
        </div>
      </div>`;
    const pad = document.getElementById('dial-pad');
    const rotEl = document.getElementById('dial-rot');
    const face = document.getElementById('dial-face');
    const step = document.getElementById('dial-step');
    const title = actLayer.querySelector('.act-title');
    const phases = [
      { dir:-1, target:4, label:'<span class="dial-step-line">② 첫 번째 잠금 해제.</span><span class="dial-step-line">이제 <b>오른쪽</b>으로 돌려</span><span class="dial-step-line"><b>8</b>에 맞추세요.</span>' },
      { dir: 1, target:8, label:'' }
    ];
    let ph = 0, rot = 0, last = null, lastDir = 0, holdT = null, done = false, lastTick = 0;
    function topValue(){ return ((Math.round(-rot/36) % 10) + 10) % 10; }
    function onTarget(){
      const snap = Math.abs(normDeg(rot + phases[ph].target * 36)) < 10;
      return snap && topValue() === phases[ph].target && lastDir === phases[ph].dir;
    }
    function move(e){
      if(done || last === null) return;
      const a = angleOf(pad, e);
      let d = normDeg(a - last); last = a;
      if(d !== 0) lastDir = d > 0 ? 1 : -1;
      /* 진행 방향이 아니면 뻑뻑하게 */
      if(lastDir !== phases[ph].dir) d *= 0.4;
      rot += d;
      rotEl.style.transform = `rotate(${rot}deg)`;
      face.textContent = topValue();
      if(Math.abs(rot - lastTick) > 12){ lastTick = rot; tone(700,.02,'square',.04); buzz(8); }
      if(onTarget()){
        if(!holdT) holdT = setTimeout(lockStep, 550);
      } else if(holdT){ clearTimeout(holdT); holdT = null; }
    }
    function lockStep(){
      holdT = null;
      pad.classList.add('locked');
      setTimeout(()=>pad.classList.remove('locked'),360);
      tone(300,.12,'square',.1); buzz([70,40,70]);
      if(ph === 0){
        ph = 1;
        step.innerHTML = phases[0].label;
      } else {
        done = true;
        tone(140,.4,'square',.12); tone(90,.6,'sine',.1,.25); buzz([120,60,200]);
        title.textContent = '철커덩! 금고가 열렸다 ― 검거 대상자 명부와 검거 대상 지시서를 확보했다!';
        title.classList.add('done');
        step.innerHTML = '금고 개방 완료 · 비밀 문서 확보';
        setTimeout(res, 1500);
      }
    }
    pad.addEventListener('pointerdown', e=>{ last = angleOf(pad, e); pad.classList.add('turning'); pad.setPointerCapture(e.pointerId); });
    pad.addEventListener('pointermove', move);
    const releaseDial=()=>{ last = null; pad.classList.remove('turning'); };
    pad.addEventListener('pointerup', releaseDial);
    pad.addEventListener('pointercancel', releaseDial);
  });
}

/* ---------- 3막→4막 전환 : 성냥을 그어 지시서를 태워라 (인력거 인계 직후, 1920년 시점) ---------- */
function actBurn(){
  return new Promise(res=>{
    const names = ['대상 갑','대상 을','대상 병','대상 정','연락책 미상','학생 조직원','인쇄 책임자','전보 연락원','외 다수'];
    actLayer.innerHTML = `
      <div class="act-box">
        <div class="act-title">윤식 ― 「좋소. 이제 이 지시서를 없애겠소. 화면의 성냥을 그어 불을 붙여 주시오.」<br>성냥을 마찰판에 문질러 불을 붙여라!</div>
        <div class="burn-scene" id="burn-scene">
          <div class="preserved-register" id="preserved-register">
            <img src="images/mokpo-independence-register.png" alt="목포의 독립운동가 전시 명단">
          </div>
          <div class="burn-paper" id="burn-paper">
            <div class="bp-title">검거 대상 지시서</div>
            <div class="bp-names">${names.map(n=>'· '+n).join('<br>')}</div>
          </div>
          <div class="preserve-message" id="preserve-message">검거 지시서는 재가 되었지만,<br>독립운동가들의 이름은 역사에 남았다.</div>
          <div class="ember" id="ember"></div>
          <div class="match" id="match">
            <div class="stick"></div><div class="head"></div><div class="flame"></div>
          </div>
          <div class="strike-strip" id="strike"></div>
        </div>
      </div>`;
    const scene = document.getElementById('burn-scene');
    const match = document.getElementById('match');
    const paper = document.getElementById('burn-paper');
    const preserved = document.getElementById('preserved-register');
    const preserveMessage = document.getElementById('preserve-message');
    const strike = document.getElementById('strike');
    const ember = document.getElementById('ember');
    const title = actLayer.querySelector('.act-title');
    let dragging = false, offX = 0, offY = 0;
    let lit = false, friction = 0, lastX = null, lastT = 0;
    let burning = false, doneAct = false;

    function headRect(){
      const r = match.getBoundingClientRect();
      return { x: r.right - 12, y: r.top + 15 };
    }
    function inside(rect, x, y){ return x>=rect.left && x<=rect.right && y>=rect.top && y<=rect.bottom; }

    match.addEventListener('pointerdown', e=>{
      dragging = true;
      const r = match.getBoundingClientRect();
      offX = e.clientX - r.left; offY = e.clientY - r.top;
      match.setPointerCapture(e.pointerId);
    });
    match.addEventListener('pointermove', e=>{
      if(!dragging || doneAct) return;
      const sr = scene.getBoundingClientRect();
      match.style.left = (e.clientX - sr.left - offX) + 'px';
      match.style.top = (e.clientY - sr.top - offY) + 'px';
      match.style.bottom = 'auto';
      const h = headRect();
      if(!lit){
        /* 마찰판 위에서 빠르게 문지르면 점화 */
        if(inside(strike.getBoundingClientRect(), h.x, h.y)){
          const now = performance.now();
          if(lastX !== null){
            const speed = Math.abs(e.clientX - lastX) / Math.max(1, now - lastT);
            if(speed > 0.35){
              friction += speed * 8;
              tone(120 + Math.random()*200, .04, 'sawtooth', .06);
              if(friction > 26) ignite();
            }
          }
          lastX = e.clientX; lastT = now;
        } else { lastX = null; }
      } else if(!burning){
        /* 불붙은 성냥을 명부에 갖다 대면 발화 */
        if(inside(paper.getBoundingClientRect(), h.x, h.y - 14)) startBurn(h.x, h.y - 14);
      }
    });
    match.addEventListener('pointerup', ()=>{ dragging = false; lastX = null; });

    function ignite(){
      lit = true;
      match.classList.add('lit');
      tone(900,.15,'sawtooth',.1); tone(500,.4,'sawtooth',.05,.05); buzz([50,30,90]);
      title.textContent = '치익――― 불이 붙었다! 불꽃을 검거 대상 지시서에 갖다 대라.';
    }
    function startBurn(px, py){
      burning = true;
      const pr = paper.getBoundingClientRect();
      const sr = scene.getBoundingClientRect();
      const bx = px - pr.left, by = py - pr.top;
      title.textContent = '붉은 검거 도장과 체포 지시서가 타오른다…';

      /* 숯 테두리 캔버스 : 종이 위에 정확히 겹치게 배치 */
      const cv = document.createElement('canvas');
      cv.className = 'burn-canvas';
      cv.width = Math.round(pr.width); cv.height = Math.round(pr.height);
      cv.style.left = (pr.left - sr.left) + 'px';
      cv.style.top = (pr.top - sr.top) + 'px';
      cv.style.width = pr.width + 'px'; cv.style.height = pr.height + 'px';
      scene.appendChild(cv);
      const ctx = cv.getContext && cv.getContext('2d');

      /* 타기 직전 그을음(스코치) 레이어 : 종이 안쪽에서 미리 갈변 */
      const scorch = document.createElement('div');
      scorch.style.cssText = 'position:absolute;inset:0;pointer-events:none;border-radius:2px;';
      paper.appendChild(scorch);

      /* 잉걸 링은 은은하게만 */
      ember.style.left = (pr.left - sr.left + bx) + 'px';
      ember.style.top = (pr.top - sr.top + by) + 'px';
      ember.style.opacity = .55;

      function spark(x, y){
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = (pr.left - sr.left + x) + 'px';
        s.style.top = (pr.top - sr.top + y) + 'px';
        s.style.setProperty('--dx', (Math.random()*46 - 23) + 'px');
        s.style.setProperty('--dy', -(26 + Math.random()*44) + 'px');
        scene.appendChild(s);
        setTimeout(()=>s.remove(), 950);
      }
      function smoke(x, y){
        const s = document.createElement('div');
        s.className = 'smoke';
        s.style.left = (pr.left - sr.left + x) + 'px';
        s.style.top = (pr.top - sr.top + y) + 'px';
        scene.appendChild(s);
        setTimeout(()=>s.remove(), 1950);
      }

      const maxR = Math.hypot(Math.max(bx, pr.width-bx), Math.max(by, pr.height-by)) + 34;
      let r = 5;
      const iv = setInterval(()=>{
        r += maxR / 78;

        /* ① 종이(글씨) 구멍 : 숯 테두리보다 살짝 안쪽 */
        const hole = Math.max(0, r - 12);
        const mask = `radial-gradient(circle at ${bx}px ${by}px, transparent ${hole}px, rgba(0,0,0,.85) ${hole+7}px, black ${hole+18}px)`;
        paper.style.webkitMaskImage = mask;
        paper.style.maskImage = mask;

        /* ② 불길 직전의 갈변 : 테두리 바깥으로 번지는 그을음 */
        scorch.style.background =
          `radial-gradient(circle at ${bx}px ${by}px, rgba(25,12,4,.9) ${r}px, rgba(70,34,10,.55) ${r+20}px, rgba(110,60,18,.25) ${r+40}px, transparent ${r+64}px)`;

        /* ③ 캔버스에 울퉁불퉁한 숯·불꽃 테두리를 찍는다 */
        if(ctx){
          for(let k=0;k<26;k++){
            const a = Math.random() * Math.PI * 2;
            /* 주황 불꽃 알갱이 (테두리 바깥쪽) */
            let rr = r + Math.random()*7;
            ctx.fillStyle = `rgba(${230+Math.random()*25},${90+Math.random()*70},20,${.25+Math.random()*.3})`;
            ctx.beginPath();
            ctx.arc(bx + Math.cos(a)*rr, by + Math.sin(a)*rr, 3 + Math.random()*6, 0, 7);
            ctx.fill();
            /* 검은 숯 알갱이 (테두리 안쪽) */
            rr = r - 3 - Math.random()*9;
            ctx.fillStyle = `rgba(${10+Math.random()*20},${6+Math.random()*10},4,${.75+Math.random()*.25})`;
            ctx.beginPath();
            ctx.arc(bx + Math.cos(a)*rr, by + Math.sin(a)*rr, 4 + Math.random()*8, 0, 7);
            ctx.fill();
          }
          /* 안쪽은 지워서 배경(재)이 드러나게 → 숯 '테두리 띠'만 남는다 */
          ctx.globalCompositeOperation = 'destination-out';
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(0, r - 16), 0, 7);
          ctx.fill();
          ctx.globalCompositeOperation = 'source-over';
        }

        /* ④ 불티·연기·잉걸 */
        const ea = Math.random() * Math.PI * 2;
        if(Math.random() < .8) spark(bx + Math.cos(ea)*r, by + Math.sin(ea)*r);
        if(Math.random() < .3) smoke(bx + Math.cos(ea)*r, by + Math.sin(ea)*r - 8);
        ember.style.width = ember.style.height = (r*2) + 'px';
        ember.style.opacity = .35 + Math.random()*.3;

        /* ⑤ 타닥타닥 */
        if(Math.random() < .7) tone(90 + Math.random()*260, .05, 'sawtooth', .05);
        if(Math.random() < .18) tone(320 + Math.random()*600, .03, 'square', .08);
        if(Math.random() < .3) buzz(14);

        if(r >= maxR){
          clearInterval(iv);
          paper.style.display = 'none';
          preserved.classList.add('reveal');
          preserveMessage.classList.add('on');
          if(ctx){ cv.style.transition = 'opacity 1.2s'; cv.style.opacity = 0; }
          ember.style.transition = 'opacity 1s'; ember.style.opacity = 0;
          match.classList.remove('lit');
          doneAct = true;
          sfx.cheer();
          title.textContent = '1920년의 검거 대상 지시서는 사라지고, 미래에 보존된 이름은 남았다.';
          title.classList.add('done');
          setTimeout(res, 1900);
        }
      }, 50);
    }
  });
}

/* ---------- 기억의 기록장에 이름을 남기다 ---------- */
function actRecordName(){
  return new Promise(res=>{
    actLayer.innerHTML = `
      <div class="act-box record-act">
        <div class="act-title">이름조차 남기지 못한 이들을 위한 기억의 기록장.<br>그의 이름을 이곳에 새겨, 우리가 기억하게 하시오.</div>
        <div class="record-ledger" id="record-ledger">
          <div class="ledger-head">기억의 기록장 · 목포 방공호</div>
          <div class="ledger-row"><span class="row-no">1</span><span class="row-name">이름 미상</span></div>
          <div class="ledger-row"><span class="row-no">2</span><span class="row-name">이름 미상</span></div>
          <div class="ledger-row"><span class="row-no">3</span><span class="row-name">이름 미상</span></div>
          <div class="ledger-row blank" id="ledger-blank"><span class="row-no">4</span><span class="row-name" id="ledger-name-slot"></span></div>
        </div>
        <div class="record-input-panel" id="record-input-panel">
          <input id="record-name-input" autocomplete="off" placeholder="이름 입력" aria-label="기억의 기록장에 남길 이름">
          <button type="button" class="btn gold" id="btn-record-submit">이름 기억하기</button>
        </div>
        <div class="record-feedback" id="record-feedback" aria-live="polite"></div>
      </div>`;
    const input = document.getElementById('record-name-input');
    const submit = document.getElementById('btn-record-submit');
    const feedback = document.getElementById('record-feedback');
    const panel = document.getElementById('record-input-panel');
    const blank = document.getElementById('ledger-blank');
    const slot = document.getElementById('ledger-name-slot');
    const title = actLayer.querySelector('.act-title');
    let done = false;
    function submitName(){
      if(done) return;
      const value = input.value.trim().replace(/\s+/g,'');
      if(value !== '윤식'){
        feedback.textContent = '그 이름이 아니오. 윤식이라 적어 주시오.';
        sfx.bad(); if(navigator.vibrate) navigator.vibrate([60,45,60]);
        input.focus();
        return;
      }
      done = true;
      feedback.textContent = '';
      input.disabled = true; submit.disabled = true;
      slot.textContent = '윤 식';
      blank.classList.add('written');
      sfx.found(); buzz([70,50,180]);
      title.textContent = '기록에는 남지 못했지만, 우리는 그 이름을 기억했다.';
      title.classList.add('done');
      setTimeout(()=>{ panel.style.opacity = 0; }, 300);
      setTimeout(res, 2000);
    }
    submit.addEventListener('click', submitName);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitName(); } });
    setTimeout(()=>input.focus(), 300);
  });
}
</script>
